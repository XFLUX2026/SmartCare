name: Build Smart Care APK (ZIP enviado)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair o projeto enviado no ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, shutil, os, sys
          repo = pathlib.Path.cwd()
          archive = repo / "files.zip"
          work = pathlib.Path("/tmp/smartcare-unpack")
          if not archive.exists():
              raise SystemExit("ERRO: files.zip não encontrado no repositório.")
          work.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall(work)
          # Se o pacote enviado contiver outro ZIP, extrai-o também.
          for _ in range(3):
              nested = list(work.rglob("*.zip"))
              if not nested:
                  break
              extracted_any = False
              for item in nested:
                  target = item.parent / (item.stem + "_extraido")
                  target.mkdir(exist_ok=True)
                  try:
                      with zipfile.ZipFile(item) as z:
                          z.extractall(target)
                      extracted_any = True
                  except zipfile.BadZipFile:
                      continue
              if not extracted_any:
                  break
          candidates = [p.parent for p in work.rglob("settings.gradle.kts")]
          if not candidates:
              print("Conteúdo encontrado no ZIP:")
              for p in list(work.rglob("*"))[:100]:
                  print(p.relative_to(work))
              raise SystemExit("ERRO: não encontrei settings.gradle.kts no ZIP.")
          # Prefere a pasta que contém também app/build.gradle.kts.
          roots = [p for p in candidates if (p / "app" / "build.gradle.kts").exists()]
          if not roots:
              raise SystemExit("ERRO: encontrei settings.gradle.kts, mas não app/build.gradle.kts.")
          src = roots[0]
          print("Projeto Android selecionado:", src)
          for item in src.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          required = ["settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts"]
          missing = [x for x in required if not (repo / x).exists()]
          if missing:
              raise SystemExit("Arquivos obrigatórios ausentes: " + ", ".join(missing))
          PY

      - name: Corrigir erros de compilação encontrados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: esperado {expected} ocorrência(s), encontrado {count}: {old!r}")
              p.write_text(s.replace(old, new))

          widget = "app/src/main/java/com/smartcare/app/HomeCareWidgetProvider.kt"
          edit(widget, 'fmt(snapshot.ram.available)', 'android.text.format.Formatter.formatShortFileSize(context, snapshot.ram.available)')
          edit(widget, 'fmt(snapshot.storage.free)', 'android.text.format.Formatter.formatShortFileSize(context, snapshot.storage.free)')

          battery = "app/src/main/java/com/smartcare/app/battery/BatteryInfo.kt"
          edit(battery, 'bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_STATE_OF_HEALTH).takeIf { it in 1..100 }',
               'null // API pública do Android não disponibiliza BATTERY_PROPERTY_STATE_OF_HEALTH')

          clean = "app/src/main/java/com/smartcare/app/ui/screens/Clean.kt"
          p = Path(clean)
          s = p.read_text()
          helper = 'private fun Modifier.background(color: Color): Modifier = this.then(androidx.compose.foundation.background(color))\\n'
          if helper not in s:
              raise SystemExit("Clean.kt: função background esperada não encontrada")
          s = s.replace(helper, '')
          if 'import androidx.compose.foundation.background\\n' not in s:
              s = s.replace('package com.smartcare.app.ui.screens\\n', 'package com.smartcare.app.ui.screens\\n\\nimport androidx.compose.foundation.background\\n', 1)
          p.write_text(s)
          print("Correções aplicadas aos três arquivos.")
          PY

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Usar Android SDK pré-instalado
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Aceitar licenças e instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Compilar APK de instalação
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCare-Projeto-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
