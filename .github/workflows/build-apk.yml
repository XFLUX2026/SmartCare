name: Build Smart Care APK (ZIP enviado)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'files.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair o projeto enviado no ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, shutil, os, sys
          repo = pathlib.Path.cwd()
          archive = repo / "files.zip"
          work = pathlib.Path("/tmp/smartcare-unpack")
          if not archive.exists():
              raise SystemExit("ERRO: files.zip não encontrado no repositório.")
          work.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall(work)
          # Se o pacote enviado contiver outro ZIP, extrai-o também.
          for _ in range(3):
              nested = list(work.rglob("*.zip"))
              if not nested:
                  break
              extracted_any = False
              for item in nested:
                  target = item.parent / (item.stem + "_extraido")
                  target.mkdir(exist_ok=True)
                  try:
                      with zipfile.ZipFile(item) as z:
                          z.extractall(target)
                      extracted_any = True
                  except zipfile.BadZipFile:
                      continue
              if not extracted_any:
                  break
          candidates = [p.parent for p in work.rglob("settings.gradle.kts")]
          if not candidates:
              print("Conteúdo encontrado no ZIP:")
              for p in list(work.rglob("*"))[:100]:
                  print(p.relative_to(work))
              raise SystemExit("ERRO: não encontrei settings.gradle.kts no ZIP.")
          # Prefere a pasta que contém também app/build.gradle.kts.
          roots = [p for p in candidates if (p / "app" / "build.gradle.kts").exists()]
          if not roots:
              raise SystemExit("ERRO: encontrei settings.gradle.kts, mas não app/build.gradle.kts.")
          src = roots[0]
          print("Projeto Android selecionado:", src)
          for item in src.iterdir():
              if item.name in {".git", ".github"}:
                  continue
              dest = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)
          required = ["settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts"]
          missing = [x for x in required if not (repo / x).exists()]
          if missing:
              raise SystemExit("Arquivos obrigatórios ausentes: " + ", ".join(missing))
          PY

      - name: Corrigir erros de compilação encontrados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: esperado {expected} ocorrência(s), encontrado {count}: {old!r}")
              p.write_text(s.replace(old, new))

          widget = "app/src/main/java/com/smartcare/app/HomeCareWidgetProvider.kt"
          edit(widget, 'fmt(snapshot.ram.available)', 'android.text.format.Formatter.formatShortFileSize(context, snapshot.ram.available)')
          edit(widget, 'fmt(snapshot.storage.free)', 'android.text.format.Formatter.formatShortFileSize(context, snapshot.storage.free)')

          battery = "app/src/main/java/com/smartcare/app/battery/BatteryInfo.kt"
          edit(battery, 'bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_STATE_OF_HEALTH).takeIf { it in 1..100 }',
               'null // API pública do Android não disponibiliza BATTERY_PROPERTY_STATE_OF_HEALTH')

          clean = "app/src/main/java/com/smartcare/app/ui/screens/Clean.kt"
          p = Path(clean)
          s = p.read_text()
          lines = s.splitlines()
          matches = [line for line in lines if line.strip().startswith('private fun Modifier.background(')]
          if len(matches) != 1:
              raise SystemExit(f"Clean.kt: esperada uma função background, encontradas {len(matches)}")
          lines = [line for line in lines if not line.strip().startswith('private fun Modifier.background(')]
          imp = 'import androidx.compose.foundation.background'
          if imp not in lines:
              package_index = next(i for i, line in enumerate(lines) if line.startswith('package '))
              lines[package_index + 1:package_index + 1] = ['', imp]
          p.write_text('\n'.join(lines) + '\n')
          # Widget transparente de relógio/clima e protetor de tela.
          from pathlib import Path
          base = Path("app/src/main")
          java = base / "java/com/smartcare/app"
          (java / "ClockWeatherManager.kt").write_text(r'''package com.smartcare.app

import android.Manifest
import android.appwidget.AppWidgetManager
import android.content.ComponentName
import android.content.Context
import android.content.pm.PackageManager
import android.location.Location
import android.location.LocationManager
import androidx.core.content.ContextCompat
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

object ClockWeatherManager {
    private const val PREFS = "clock_weather"
    fun summary(context: Context) = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
        .getString("summary", "Ative a localização no Smart Care para ver o clima") ?: "Clima indisponível"
    fun refresh(context: Context) {
        val app = context.applicationContext
        Thread {
            try {
                val fine = ContextCompat.checkSelfPermission(app, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                val coarse = ContextCompat.checkSelfPermission(app, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                if (!fine && !coarse) { save(app, "Ative a localização no Smart Care para ver o clima"); return@Thread }
                val lm = app.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                val loc: Location? = lm.getProviders(true).mapNotNull { provider ->
                    try { lm.getLastKnownLocation(provider) } catch (_: SecurityException) { null }
                }.maxByOrNull { it.time }
                if (loc == null) { save(app, "Aguardando GPS. Ative a localização e tente novamente."); return@Thread }
                val url = URL("https://api.open-meteo.com/v1/forecast?latitude=" + loc.latitude + "&longitude=" + loc.longitude + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto")
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000; conn.readTimeout = 10000
                val json = JSONObject(conn.inputStream.bufferedReader().use { it.readText() }); conn.disconnect()
                val current = json.getJSONObject("current"); val daily = json.getJSONObject("daily")
                val temp = current.getDouble("temperature_2m").toInt()
                val code = current.getInt("weather_code")
                val max = daily.getJSONArray("temperature_2m_max").getDouble(0).toInt()
                val min = daily.getJSONArray("temperature_2m_min").getDouble(0).toInt()
                val condition = when (code) {
                    0 -> "Céu limpo"; 1, 2 -> "Parcialmente nublado"; 3 -> "Nublado"
                    45, 48 -> "Neblina"; 51, 53, 55, 56, 57 -> "Garoa"
                    61, 63, 65, 66, 67, 80, 81, 82 -> "Chuva"
                    71, 73, 75, 77, 85, 86 -> "Neve"; 95, 96, 99 -> "Trovoadas"
                    else -> "Condição variável"
                }
                save(app, "$condition • $temp°C • Máx. $max° / Mín. $min°")
            } catch (_: Exception) { save(app, "Sem atualização do clima. Verifique a internet.") }
        }.start()
    }
    private fun save(context: Context, value: String) {
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("summary", value).apply()
        val manager = AppWidgetManager.getInstance(context)
        val ids = manager.getAppWidgetIds(ComponentName(context, ClockWeatherWidgetProvider::class.java))
        if (ids.isNotEmpty()) ClockWeatherWidgetProvider.update(context, manager, ids)
    }
}
''')
          (java / "ClockWeatherWidgetProvider.kt").write_text(r'''package com.smartcare.app
import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.Context
import android.widget.RemoteViews
class ClockWeatherWidgetProvider : AppWidgetProvider() {
    override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
        update(context, manager, ids); ClockWeatherManager.refresh(context)
    }
    companion object {
        fun update(context: Context, manager: AppWidgetManager, ids: IntArray) {
            ids.forEach { id ->
                val views = RemoteViews(context.packageName, R.layout.clock_weather_widget)
                views.setTextViewText(R.id.clock_weather_summary, ClockWeatherManager.summary(context))
                manager.updateAppWidget(id, views)
            }
        }
    }
}
''')
          (java / "SmartCareDreamService.kt").write_text(r'''package com.smartcare.app
import android.service.dreams.DreamService
import android.view.Gravity
import android.view.ViewGroup
import android.widget.LinearLayout
import android.widget.TextClock
import android.widget.TextView
import android.graphics.Color
class SmartCareDreamService : DreamService() {
    override fun onAttachedToWindow() {
        super.onAttachedToWindow()
        isInteractive = false; isFullscreen = true
        val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setBackgroundColor(Color.BLACK); setPadding(28,28,28,28) }
        val clock = TextClock(this).apply { format12Hour = "h:mm"; format24Hour = "HH:mm"; textSize = 82f; setTextColor(Color.WHITE); gravity = Gravity.CENTER }
        val date = TextClock(this).apply { format12Hour = "EEEE, d 'de' MMMM"; format24Hour = "EEEE, d 'de' MMMM"; textSize = 20f; setTextColor(0xFFB8C7D9.toInt()); gravity = Gravity.CENTER }
        val weather = TextView(this).apply { text = ClockWeatherManager.summary(this@SmartCareDreamService); textSize = 18f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; setPadding(0,28,0,0) }
        root.addView(clock, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
        root.addView(date, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
        root.addView(weather, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
        setContentView(root)
    }
    override fun onDreamingStarted() { super.onDreamingStarted(); ClockWeatherManager.refresh(this) }
}
''')
          (base / "res/layout/clock_weather_widget.xml").write_text(r'''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
 android:layout_width="match_parent" android:layout_height="match_parent"
 android:orientation="vertical" android:gravity="center" android:padding="12dp"
 android:background="@android:color/transparent">
 <TextClock android:layout_width="match_parent" android:layout_height="wrap_content"
  android:format12Hour="h:mm" android:format24Hour="HH:mm" android:textColor="#FFFFFFFF"
  android:textSize="52sp" android:gravity="center" android:shadowColor="#CC000000" android:shadowRadius="8"/>
 <TextClock android:layout_width="match_parent" android:layout_height="wrap_content"
  android:format12Hour="EEEE, d 'de' MMMM" android:format24Hour="EEEE, d 'de' MMMM"
  android:textColor="#FFFFFFFF" android:textSize="14sp" android:gravity="center"/>
 <TextView android:id="@+id/clock_weather_summary" android:layout_width="match_parent"
  android:layout_height="wrap_content" android:text="Ative a localização no Smart Care para ver o clima"
  android:textColor="#FFFFFFFF" android:textSize="14sp" android:gravity="center" android:paddingTop="8dp"
  android:shadowColor="#CC000000" android:shadowRadius="6"/>
</LinearLayout>
''')
          (base / "res/xml/clock_weather_widget_info.xml").write_text(r'''<?xml version="1.0" encoding="utf-8"?>
<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
 android:description="@string/clock_weather_widget_description" android:initialLayout="@layout/clock_weather_widget"
 android:minWidth="180dp" android:minHeight="110dp" android:resizeMode="horizontal|vertical"
 android:updatePeriodMillis="1800000" android:widgetCategory="home_screen|keyguard"/>
''')
          (base / "res/values/clock_weather_strings.xml").write_text(r'''<?xml version="1.0" encoding="utf-8"?>
<resources><string name="clock_weather_widget_description">Relógio transparente com data e clima</string><string name="smartcare_dream_label">Relógio e clima Smart Care</string></resources>
''')
          manifest = base / "AndroidManifest.xml"
          ms = manifest.read_text()
          ms = ms.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>')
          declarations = '''
          <receiver android:name=".ClockWeatherWidgetProvider" android:exported="true">
            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
            <meta-data android:name="android.appwidget.provider" android:resource="@xml/clock_weather_widget_info"/>
          </receiver>
          <service android:name=".SmartCareDreamService" android:exported="true"
            android:permission="android.permission.BIND_DREAM_SERVICE" android:label="@string/smartcare_dream_label">
            <intent-filter><action android:name="android.service.dreams.DreamService"/></intent-filter>
          </service>
          '''
          ms = ms.replace('    </application>', declarations + '    </application>')
          manifest.write_text(ms)
          gradle = Path("app/build.gradle.kts")
          gs = gradle.read_text().replace("versionCode = 2", "versionCode = 3").replace('versionName = "0.2"', 'versionName = "0.3"')
          gradle.write_text(gs)
          print("Relógio transparente, clima e protetor de tela adicionados.")

          print("Correções aplicadas aos três arquivos.")
          PY

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Usar Android SDK pré-instalado
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Aceitar licenças e instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Compilar APK de instalação
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCare-Projeto-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
